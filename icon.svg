<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- طیف‌های طلایی سه‌بعدی و متالیک -->
    <linearGradient id="goldBevel" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="20%" stop-color="#E6BE53" />
      <stop offset="48%" stop-color="#9E6E10" />
      <stop offset="75%" stop-color="#F6D574" />
      <stop offset="100%" stop-color="#7D5408" />
    </linearGradient>

    <linearGradient id="goldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE9A8" />
      <stop offset="35%" stop-color="#D7AC38" />
      <stop offset="68%" stop-color="#A87814" />
      <stop offset="100%" stop-color="#F4CF67" />
    </linearGradient>

    <radialGradient id="goldSunFill" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFF2BF" />
      <stop offset="55%" stop-color="#DDA932" />
      <stop offset="100%" stop-color="#9A6B0D" />
    </radialGradient>

    <!-- طیف‌های سرمه‌ای لاجوردی برای ایجاد عمق بین لایه‌ها -->
    <radialGradient id="navyDeep" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#172F54" />
      <stop offset="60%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#071020" />
    </radialGradient>

    <radialGradient id="bgVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141A24" />
      <stop offset="100%" stop-color="#06080C" />
    </radialGradient>

    <!-- فیلتر برجستگی و سایه برای حس فلز طلا روی مینای سرمه‌ای -->
    <filter id="goldEmboss" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#02050B" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#FFF5CC" flood-opacity="0.25" />
    </filter>

    <filter id="outerRingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- ۱. ماژول لایه سوم (عمیق‌ترین لایه گلبرگ‌های نوک‌تیز پس‌زمینه) -->
    <g id="mandalaLayer3">
      <path d="M 600 185
               C 635 215, 658 245, 650 285
               C 625 275, 612 275, 600 282
               C 588 275, 575 275, 550 285
               C 542 245, 565 215, 600 185 Z" fill="#0B182E" stroke="url(#goldWire)" stroke-width="4.2" stroke-linejoin="round" />
      <path d="M 600 202 C 622 224, 636 246, 630 272 C 616 266, 607 266, 600 271 C 593 266, 584 266, 570 272 C 564 246, 578 224, 600 202 Z" fill="none" stroke="url(#goldWire)" stroke-width="2" />
    </g>

    <!-- ۲. ماژول لایه دوم (گلبرگ‌های قوس‌دار میانی با نقوش برگ‌شکل) -->
    <g id="mandalaLayer2">
      <path d="M 600 144
               C 644 176, 672 214, 662 264
               C 636 250, 616 248, 600 256
               C 584 248, 564 250, 538 264
               C 528 214, 556 176, 600 144 Z" fill="#0E1F3A" stroke="url(#goldWire)" stroke-width="4.8" stroke-linejoin="round" />
      <!-- قوس داخلی -->
      <path d="M 600 163
               C 632 188, 652 218, 644 250
               C 625 241, 611 240, 600 245
               C 589 240, 575 241, 556 250
               C 548 218, 568 188, 600 163 Z" fill="none" stroke="url(#goldWire)" stroke-width="2.2" />
      <!-- برگ‌های ظریف اسلیمی داخل لایه دوم -->
      <path d="M 600 242 L 600 182" fill="none" stroke="url(#goldWire)" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 600 242 C 618 222, 626 204, 624 190 C 612 198, 605 214, 600 242 Z" fill="none" stroke="url(#goldWire)" stroke-width="2" />
      <path d="M 600 242 C 582 222, 574 204, 576 190 C 588 198, 595 214, 600 242 Z" fill="none" stroke="url(#goldWire)" stroke-width="2" />
    </g>

    <!-- ۳. ماژول لایه اول (۱۲ گلبرگ اصلی بیرونی با جزئیات کامل) -->
    <g id="mandalaLayer1">
      <!-- بدنه اصلی گلبرگ با نوک تیز تاج‌مانند -->
      <path d="M 600 98
               C 618 124, 646 138, 668 164
               C 684 184, 686 212, 676 236
               C 650 222, 622 220, 600 230
               C 578 220, 550 222, 524 236
               C 514 212, 516 184, 532 164
               C 554 138, 582 124, 600 98 Z" fill="#102342" stroke="url(#goldBevel)" stroke-width="5.5" stroke-linejoin="round" />

      <!-- حاشیه موازی داخلی -->
      <path d="M 600 118
               C 614 138, 636 150, 653 171
               C 665 186, 666 206, 659 222
               C 639 212, 618 210, 600 218
               C 582 210, 561 212, 541 222
               C 534 206, 535 186, 547 171
               C 564 150, 586 138, 600 118 Z" fill="none" stroke="url(#goldWire)" stroke-width="2.6" />

      <!-- نقش سه‌برگ اسلیمی درون هر گلبرگ -->
      <path d="M 600 214 C 593 184, 593 158, 600 138 C 607 158, 607 184, 600 214 Z" fill="none" stroke="url(#goldWire)" stroke-width="2.4" />
      <path d="M 600 214 C 616 196, 632 178, 640 166 C 624 168, 610 184, 600 214 Z" fill="none" stroke="url(#goldWire)" stroke-width="2.4" />
      <path d="M 600 214 C 584 196, 568 178, 560 166 C 576 168, 590 184, 600 214 Z" fill="none" stroke="url(#goldWire)" stroke-width="2.4" />
    </g>

    <!-- ۴. ماژول خورشید ۱۶ تایی با ۹ پرتو دقیق -->
    <g id="sunModule">
      <g stroke="url(#goldWire)" stroke-width="3" stroke-linecap="round">
        <line x1="600" y1="354" x2="600" y2="318" />
        <line x1="589" y1="356" x2="581" y2="322" />
        <line x1="611" y1="356" x2="619" y2="322" />
        <line x1="579" y1="361" x2="564" y2="331" />
        <line x1="621" y1="361" x2="636" y2="331" />
        <line x1="571" y1="368" x2="551" y2="344" />
        <line x1="629" y1="368" x2="649" y2="344" />
        <line x1="565" y1="376" x2="542" y2="360" />
        <line x1="635" y1="376" x2="658" y2="360" />
      </g>
      <!-- قرص نیم‌دایره خورشید -->
      <path d="M 575 382 A 25 25 0 0 1 625 382 Z" fill="url(#goldSunFill)" stroke="url(#goldBevel)" stroke-width="2" />
    </g>
  </defs>

  <!-- پس‌زمینه -->

  <!-- گروه اصلی لوگو -->
  <g filter="url(#outerRingShadow)">
    <!-- قاب فلزی طلایی بیرونی -->
    <circle cx="600" cy="600" r="552" fill="url(#navyDeep)" stroke="url(#goldBevel)" stroke-width="20" />
    <circle cx="600" cy="600" r="538" fill="none" stroke="url(#goldWire)" stroke-width="3" />

    <!-- حلقه مروارید/نقطه‌چین طلایی دور قاب -->
    <circle cx="600" cy="600" r="522" fill="none" stroke="url(#goldBevel)" stroke-width="11" stroke-dasharray="0.1 27.33" stroke-linecap="round" />

    <!-- خطوط مرزی داخلی قاب -->
    <circle cx="600" cy="600" r="506" fill="none" stroke="url(#goldBevel)" stroke-width="4.5" />
    <circle cx="600" cy="600" r="498" fill="none" stroke="url(#goldWire)" stroke-width="2" />
  </g>

  <g filter="url(#goldEmboss)">
    <!-- لایه سوم ماندالا (۲۴ گلبرگ ریز در پس‌زمینه) -->
    <g id="ringLayer3">
      <use href="#mandalaLayer3" transform="rotate(7.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(22.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(37.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(52.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(67.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(82.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(97.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(112.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(127.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(142.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(157.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(172.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(187.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(202.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(217.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(232.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(247.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(262.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(277.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(292.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(307.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(322.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(337.5 600 600)" />
      <use href="#mandalaLayer3" transform="rotate(352.5 600 600)" />
    </g>

    <!-- لایه دوم ماندالا (۱۲ گلبرگ میانی با زاویه ۱۵ درجه اختلاف) -->
    <g id="ringLayer2">
      <use href="#mandalaLayer2" transform="rotate(15 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(45 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(75 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(105 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(135 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(165 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(195 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(225 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(255 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(285 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(315 600 600)" />
      <use href="#mandalaLayer2" transform="rotate(345 600 600)" />
    </g>

    <!-- لایه اول ماندالا (۱۲ گلبرگ اصلی بیرونی) -->
    <g id="ringLayer1">
      <use href="#mandalaLayer1" transform="rotate(0 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(30 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(60 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(90 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(120 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(150 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(180 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(210 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(240 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(270 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(300 600 600)" />
      <use href="#mandalaLayer1" transform="rotate(330 600 600)" />
    </g>

    <!-- رینگ جداکننده ماندالا و حلقه خورشید -->
    <circle cx="600" cy="600" r="376" fill="url(#navyDeep)" stroke="url(#goldBevel)" stroke-width="8" />
    <circle cx="600" cy="600" r="364" fill="none" stroke="url(#goldWire)" stroke-width="2.5" />

    <!-- حلقه ۱۶ خورشید درخشان -->
    <g id="sunRing16">
      <use href="#sunModule" transform="rotate(0 600 600)" />
      <use href="#sunModule" transform="rotate(22.5 600 600)" />
      <use href="#sunModule" transform="rotate(45 600 600)" />
      <use href="#sunModule" transform="rotate(67.5 600 600)" />
      <use href="#sunModule" transform="rotate(90 600 600)" />
      <use href="#sunModule" transform="rotate(112.5 600 600)" />
      <use href="#sunModule" transform="rotate(135 600 600)" />
      <use href="#sunModule" transform="rotate(157.5 600 600)" />
      <use href="#sunModule" transform="rotate(180 600 600)" />
      <use href="#sunModule" transform="rotate(202.5 600 600)" />
      <use href="#sunModule" transform="rotate(225 600 600)" />
      <use href="#sunModule" transform="rotate(247.5 600 600)" />
      <use href="#sunModule" transform="rotate(270 600 600)" />
      <use href="#sunModule" transform="rotate(292.5 600 600)" />
      <use href="#sunModule" transform="rotate(315 600 600)" />
      <use href="#sunModule" transform="rotate(337.5 600 600)" />
    </g>

    <!-- مدالیون دایره‌ای مرکزی -->
    <circle cx="600" cy="600" r="222" fill="url(#navyDeep)" stroke="url(#goldBevel)" stroke-width="8" />
    <circle cx="600" cy="600" r="210" fill="none" stroke="url(#goldWire)" stroke-width="2.5" />

    <!-- گل نیلوفر آبی (لوتوس) ۱۲ گلبرگه با جزئیات کامل -->
    <g id="masterLotus" stroke="url(#goldBevel)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- ۱. گلبرگ‌های زیرین افقی -->
      <path d="M 600 656 C 520 662, 460 632, 428 594 C 480 580, 542 598, 600 656 Z" fill="#0F203C" />
      <path d="M 600 656 C 680 662, 740 632, 772 594 C 720 580, 658 598, 600 656 Z" fill="#0F203C" />
      <!-- رگبرگ داخلی افقی -->
      <path d="M 578 630 C 528 624, 485 608, 456 596" fill="none" stroke="url(#goldWire)" stroke-width="2.2" />
      <path d="M 622 630 C 672 624, 715 608, 744 596" fill="none" stroke="url(#goldWire)" stroke-width="2.2" />

      <!-- ۲. گلبرگ‌های پایینی معکوس (کاسبرگ‌ها) -->
      <path d="M 600 656 C 556 676, 514 676, 486 654 C 516 634, 560 638, 600 656 Z" fill="#0C1A32" />
      <path d="M 600 656 C 644 676, 686 676, 714 654 C 684 634, 640 638, 600 656 Z" fill="#0C1A32" />

      <path d="M 600 656 C 562 688, 534 714, 544 734 C 574 720, 592 690, 600 656 Z" fill="#0E1E38" />
      <path d="M 600 656 C 638 688, 666 714, 656 734 C 626 720, 608 690, 600 656 Z" fill="#0E1E38" />

      <!-- گلبرگ نوک‌تیز زیرین مرکزی -->
      <path d="M 600 656 C 580 694, 588 726, 600 746 C 612 726, 620 694, 600 656 Z" fill="#112442" />
      <line x1="600" y1="666" x2="600" y2="722" stroke="url(#goldWire)" stroke-width="2" />

      <!-- ۳. گلبرگ‌های میانی پهن (ردیف دوم) -->
      <path d="M 600 656 C 516 620, 470 564, 470 506 C 526 518, 572 574, 600 656 Z" fill="#122646" />
      <path d="M 600 656 C 684 620, 730 564, 730 506 C 674 518, 628 574, 600 656 Z" fill="#122646" />
      <path d="M 580 622 C 538 588, 506 552, 492 526" fill="none" stroke="url(#goldWire)" stroke-width="2.2" />
      <path d="M 620 622 C 662 588, 694 552, 708 526" fill="none" stroke="url(#goldWire)" stroke-width="2.2" />

      <!-- ۴. گلبرگ‌های بالایی کشیده (ردیف سوم) -->
      <path d="M 600 656 C 542 588, 528 518, 546 460 C 586 496, 600 566, 600 656 Z" fill="#152C50" />
      <path d="M 600 656 C 658 588, 672 518, 654 460 C 614 496, 600 566, 600 656 Z" fill="#152C50" />
      <path d="M 588 614 C 566 566, 558 518, 560 486" fill="none" stroke="url(#goldWire)" stroke-width="2" />
      <path d="M 612 614 C 634 566, 642 518, 640 486" fill="none" stroke="url(#goldWire)" stroke-width="2" />

      <!-- ۵. گلبرگ اصلی و مرکزی لوتوس -->
      <path d="M 600 656 C 558 580, 558 496, 600 436 C 642 496, 642 580, 600 656 Z" fill="#18325B" />

      <!-- خط و قطره نورانی درون گلبرگ مرکزی -->
      <line x1="600" y1="646" x2="600" y2="544" stroke="url(#goldWire)" stroke-width="3.2" />
      <path d="M 600 504 C 590 522, 591 538, 600 544 C 609 538, 610 522, 600 504 Z" fill="url(#goldSunFill)" stroke="none" />
    </g>
  </g>
</svg>